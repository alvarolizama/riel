name: riel
version: 3.0.0
description: "Riel — steering for long tasks: a project orders shapings (.riel/project.md), each shaping answers ONE question (.riel/shapings/), and each contract executes one shaping with typed gate evidence (.riel/runs/<slug>.md, executed in place — several may be active at once, run=<slug> selects one). Seven typed tools, the pre_verify gate across the active contracts, automatic session checks and the desktop chip. Riel explains the formats and validates them; it never authors them. No command line and no skills: the tools are the surface."
author: Álvaro Lizama
license: MIT
homepage: https://github.com/alvarolizama/riel
provides_tools:
  - riel_guide
  - riel_project
  - riel_shape
  - riel_run
  - riel_note
  - riel_clean
  - riel_check
provides_hooks:
  - pre_verify
config_schema:
  gate: {type: bool, default: true, description: "Enforce the Riel gate: after a turn that edited code in a worktree with an ACTIVE run, keep going while the run has claims or gates without recorded evidence."}
  gate_attempts: {type: int, default: 1, description: "How many times the gate may nudge per turn (0–10; Hermes caps pre_verify continues at agent.max_verify_nudges)."}
  context: {type: bool, default: true, description: "Publish the `riel` prompt section: the door to the prose plus the worktree's active run. Off ⇒ the section renders empty and Hermes discards it."}
  harness_note: {type: str, default: "", description: "Operator's own line appended to the prompt section — the place for what the model of the day needs (e.g. \"tools are deferred: reach them with tool_search\"). Empty by default."}
  tools: {type: bool, default: true, description: "Expose the riel_* tools (the prose included: `riel_guide`). Off hides them from the model and the handlers refuse, without running the engine."}
